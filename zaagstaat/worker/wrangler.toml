name = "zaagstaat-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# KV namespace — create with:
#   wrangler kv namespace create PROJECTS
# then paste the resulting id below.
[[kv_namespaces]]
binding = "PROJECTS"
id = "4cd7c223a5154d7cbe6a23abda43c30b"

# For local dev, Wrangler uses a local KV store automatically.
# preview_id is optional (used in wrangler dev --remote)
# preview_id = "REPLACE_WITH_PREVIEW_ID"

[vars]
# Restrict CORS to your deployed frontend. Use "*" during development.
ALLOWED_ORIGIN = "https://zaagstaat.studiokroos.nl"
# Hetzner server IP — used by the OG proxy to forward browser requests.
# Leave empty if the domain does NOT route through Cloudflare.
HETZNER_ORIGIN = "https://46.225.223.181"

# Route: intercept all requests to the subdomain (only active when DNS is proxied)
# Uncomment after setting DNS to Cloudflare Proxied:
# routes = [{ pattern = "zaagstaat.studiokroos.nl/*", zone_name = "studiokroos.nl" }]
